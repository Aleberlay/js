<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Décima entrega Berlay</title>
  <link rel="stylesheet" href="css/style.css">

  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>

<body>

  <div class="card">
    <div id="aviso-promo" class="aviso" style="display: none;"></div>

    <h1>Simulador de Carrito de Compras</h1>

    <div id="mensaje"></div>

    <div class="formulario">
      <input type="number" id="input-id" placeholder="ID del producto">
      <input type="text" id="input-nombre" placeholder="Nombre del producto">
      <input type="number" id="input-precio" placeholder="Precio">
      <input type="number" id="input-stock" placeholder="Stock">
      <button id="btn-agregar" class="btn">Agregar Producto</button>
    </div>

    <div class="buscador" style="margin-top: 15px;">
      <input type="text" id="input-buscar" placeholder="Buscar por nombre o ID...">
    </div>

    <h2>Productos en Carrito</h2>
    <div id="contenedor"></div>
  </div>

  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

  <script src="js/main.js"></script>

</body>

</html>
